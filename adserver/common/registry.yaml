# Feature registry — the governed contract every feature-producing job
# (batch now, streaming from Phase 2) must honor. See common/registry.py
# for the loader/validator and adserver/batch_features/README.md for how
# these get computed and materialized.

features:
  - name: user_ctr_by_category_30d
    entity: user
    dtype: map[str,float]
    description: Per-category click-through rate over the trailing 30 days.
    aggregation: ctr
    window: 30d
    freshness_sla: 24h
    default: {}
    owner: ads-ml

  - name: user_rides_per_week
    entity: user
    dtype: float
    description: Ride count in the trailing 7 days, from rides.parquet.
    aggregation: count
    window: 7d
    freshness_sla: 24h
    default: 0.0
    owner: ads-ml

  - name: user_ctr_30d
    entity: user
    dtype: float
    description: Overall click-through rate over the trailing 30 days, across all categories.
    aggregation: ctr
    window: 30d
    freshness_sla: 24h
    default: 0.0
    owner: ads-ml

  - name: user_impressions_7d
    entity: user
    dtype: int
    description: Ad impression count in the trailing 7 days — engagement volume.
    aggregation: count
    window: 7d
    freshness_sla: 24h
    default: 0
    owner: ads-ml

  - name: ad_ctr_7d
    entity: ad
    dtype: float
    description: Click-through rate over the trailing 7 days for this campaign.
    aggregation: ctr
    window: 7d
    freshness_sla: 24h
    default: 0.0
    owner: ads-ml

  - name: ad_ctr_30d
    entity: ad
    dtype: float
    description: Click-through rate over the trailing 30 days for this campaign.
    aggregation: ctr
    window: 30d
    freshness_sla: 24h
    default: 0.0
    owner: ads-ml

  - name: ad_impressions_7d
    entity: ad
    dtype: int
    description: Impression count in the trailing 7 days for this campaign.
    aggregation: count
    window: 7d
    freshness_sla: 24h
    default: 0
    owner: ads-ml

  - name: campaign_spend_yesterday
    entity: ad
    dtype: float
    description: >-
      Spend for the prior day. Auction campaigns: impressions x bid.
      Guaranteed campaigns have no bid, so spend is always 0.0.
    aggregation: sum
    window: 1d
    freshness_sla: 24h
    default: 0.0
    owner: ads-ml

  - name: audience_memberships
    entity: user
    dtype: list[str]
    description: Names of audiences (audiences.yaml) this user currently belongs to.
    aggregation: membership
    window: n/a
    freshness_sla: 24h
    default: []
    owner: ads-ml

  - name: user_account_age_days
    entity: user
    dtype: int
    description: Days since account creation, as of the query date.
    aggregation: none
    window: n/a
    freshness_sla: 24h
    default: 0
    owner: ads-ml

  # --- Phase 2: real-time session features (stream_features/), Redis-backed,
  # written with a 30-minute TTL. freshness_sla is in seconds here, not
  # hours, since these are meant to be fresh within a couple of seconds.
  - name: user_session_active
    entity: user
    dtype: bool
    description: >-
      Whether the user currently has an active session (any session event
      seen within the last 30 minutes).
    aggregation: presence
    window: n/a
    freshness_sla: 5s
    default: false
    owner: ads-ml

  - name: user_current_destination_category
    entity: user
    dtype: str
    description: Category of the most recently entered destination in the current session.
    aggregation: latest
    window: n/a
    freshness_sla: 5s
    default: ""
    owner: ads-ml

  - name: user_current_ride_type
    entity: user
    dtype: str
    description: Most recently selected ride type in the current session.
    aggregation: latest
    window: n/a
    freshness_sla: 5s
    default: ""
    owner: ads-ml

  - name: user_screens_viewed_10min
    entity: user
    dtype: int
    description: Count of app screens viewed in the trailing 10 minutes.
    aggregation: count
    window: 10m
    freshness_sla: 5s
    default: 0
    owner: ads-ml

  # Phase 2 AC7 extensibility proof: one handler module + this entry +
  # one new EVENT_TYPES entry (promo_viewed was new) - zero edits to
  # consumer.py/framework.py/state.py.
  - name: promos_viewed_10min
    entity: user
    dtype: int
    description: Count of promos viewed in the trailing 10 minutes.
    aggregation: count
    window: 10m
    freshness_sla: 5s
    default: 0
    owner: ads-ml
